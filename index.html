<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arbre généalogique</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="en-ligne.css">
  <script>
    // thème choisi (auto = celui de Windows), appliqué avant l'affichage pour éviter un flash
    (function () {
      var m = "light"; try { m = JSON.parse(localStorage.getItem("arbre.theme")) || "light"; } catch (e) {}
      var dark = m === "dark" || (m === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2a4 4 0 0 1 3.9 3.1A4 4 0 0 1 19 9a4 4 0 0 1-3 3.87V14h-3v8h-2v-8H8v-1.13A4 4 0 0 1 5 9a4 4 0 0 1 3.1-3.9A4 4 0 0 1 12 2Z"/></svg>
      <span data-i18n="brand">Arbre</span>
      <span class="count" id="count"></span>
    </div>
    <nav class="viewswitch" aria-label="Vue" data-i18n-aria="view">
      <button id="viewTree" class="on" data-i18n="viewTree">Arbre</button>
      <button id="viewMap" data-i18n="viewMap">Carte</button>
    </nav>
    <div class="search">
      <input id="search" type="search" placeholder="Rechercher une personne…" autocomplete="off" aria-label="Rechercher une personne" data-i18n-ph="search" data-i18n-aria="search">
      <ul id="results" class="results" hidden></ul>
    </div>
    <button id="menuBtn" class="icon-btn menu-btn" title="Options" aria-label="Options" aria-expanded="false" aria-controls="controls" data-i18n-title="menu" data-i18n-aria="menu">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="controls" id="controls">
      <label title="Générations d'ascendants" data-i18n-title="ancestorsTitle"><span data-i18n="ancestors">Ascendants</span>
        <select id="genUp">
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option value="99" selected data-i18n="all">Toutes</option>
        </select>
      </label>
      <label title="Générations de descendants" data-i18n-title="descendantsTitle"><span data-i18n="descendants">Descendants</span>
        <select id="genDown">
          <option>0</option><option>1</option><option selected>2</option><option>3</option><option>4</option><option value="99" data-i18n="all">Toutes</option>
        </select>
      </label>
      <label class="check" title="Afficher les frères et sœurs dans l'arbre" data-i18n-title="siblingsTitle">
        <input type="checkbox" id="showSibs" checked> <span data-i18n="siblings">Frères et sœurs</span>
      </label>
      <select id="langSel" class="lang" aria-label="Langue"></select>
      <button id="themeBtn" class="icon-btn" title="Thème" aria-label="Changer de thème" data-i18n-aria="theme">
        <svg class="i-auto" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg>
        <svg class="i-light" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4" fill="currentColor"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-dark" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </button>
      <button id="undo" class="icon-btn" title="Annuler (Ctrl+Z)" aria-label="Annuler" data-i18n-title="undo" data-i18n-aria="undo">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button id="redo" class="icon-btn" title="Rétablir (Ctrl+Y)" aria-label="Rétablir" data-i18n-title="redo" data-i18n-aria="redo">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m15 14 5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
      </button>
      <button id="newPerson" class="btn" data-i18n="newPerson">+ Personne</button>
      <a id="export" class="btn primary" href="/api/export" title="Télécharger le GEDCOM à jour (réimportable dans Geneanet)" data-i18n-title="exportTitle" data-i18n="export">Exporter GEDCOM</a>
    </div>
  </header>

  <main class="layout">
    <section class="canvas" id="canvas" aria-label="Arbre" data-i18n-aria="viewTree">
      <div class="world" id="world">
        <svg class="links" id="links"></svg>
        <div id="cards"></div>
      </div>
      <div class="zoom">
        <button class="icon-btn" id="zoomIn" title="Zoom avant" aria-label="Zoom avant" data-i18n-title="zoomIn" data-i18n-aria="zoomIn">+</button>
        <button class="icon-btn" id="zoomOut" title="Zoom arrière" aria-label="Zoom arrière" data-i18n-title="zoomOut" data-i18n-aria="zoomOut">−</button>
        <button class="icon-btn" id="recenter" title="Tout voir" aria-label="Tout voir" data-i18n-title="fitAll" data-i18n-aria="fitAll">
          <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="3" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="2" d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        </button>
      </div>
    </section>
    <section class="mapview" id="mapView" hidden aria-label="Carte" data-i18n-aria="viewMap">
      <div id="map"></div>
      <div class="mapctl" id="mapCtl"></div>
      <div class="maplegend" id="mapLegend"></div>
      <button class="btn mapctl-btn" id="mapCtlBtn" aria-expanded="false" aria-controls="mapCtl" data-i18n="mapFilters">Filtres</button>
    </section>
    <div class="sheet-grip" id="sheetGrip" role="button" tabindex="0" aria-label="Agrandir ou réduire la fiche" data-i18n-aria="sheetToggle"><span></span></div>
    <aside class="panel" id="panel"></aside>
  </main>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" id="modalClose" aria-label="Fermer" data-i18n-aria="close">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="en-ligne.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script src="map.js"></script>
  <script src="mobile.js"></script>
</body>
</html>
